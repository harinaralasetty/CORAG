name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      # sentence-transformers pulls in torch; the CPU wheel avoids gigabytes of CUDA packages.
      # Keep the version in step with requirements-lock.txt.
      - name: Install CPU-only torch
        run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
