name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        indic: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      # sentence-transformers pulls in torch; the CPU wheel avoids gigabytes of CUDA packages.
      # Keep the version in step with requirements-lock.txt.
      - name: Install CPU-only torch
        run: python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install optional Indic recovery
        if: matrix.indic
        run: |
          echo 'torch==2.12.0' > /tmp/corag-indic-constraints.txt
          python -m pip install -r requirements-indic.txt -c /tmp/corag-indic-constraints.txt
      - name: Run offline Indic example
        if: matrix.indic
        run: python scripts/demo_indic_pdf.py
      - name: Run tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t corag .
      - name: Check the container serves the app
        run: |
          touch .env
          docker run -d --name corag -p 127.0.0.1:8080:8080 -v "$PWD/.env:/app/.env:ro" corag
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ | grep -q '<title>CORAG' && exit 0
            sleep 2
          done
          docker logs corag
          exit 1
